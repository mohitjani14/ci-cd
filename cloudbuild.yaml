# cloudbuild.yaml
steps:
# Step 1: Run unit tests
- name: 'python:3.9-slim-buster'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      # Install dependencies from the 'app' directory
      pip install -r app/requirements.txt
      # Set PYTHONPATH for the current shell session
      export PYTHONPATH=$PYTHONPATH:/workspace
      # Run pytest from the root of the repository, pointing to the tests directory
      pytest app/tests/
  id: 'Run Unit Tests'
  # NO 'dir' specified here, as we are running from the root of the workspace

# Step 2: Build the Docker image
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/my-repo/my-app:$COMMIT_SHA', '.']
  id: 'Build Docker Image'

# Step 3: Push the Docker image to Artifact Registry
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/my-repo/my-app:$COMMIT_SHA']
  id: 'Push to Artifact Registry'

# Step 4: Deploy the image to Cloud Run
- name: 'gcr.io/google.com/cloudsdk/cloud-sdk'
  args:
    - 'gcloud'
    - 'run'
    - 'deploy'
    - 'my-gcp-cicd-app' # Service name
    - '--image'
    - 'us-central1-docker.pkg.dev/$PROJECT_ID/my-repo/my-app:$COMMIT_SHA'
    - '--region'
    - 'us-central1'
    - '--platform'
    - 'managed'
    - '--allow-unauthenticated' # Allow public access for this example
  id: 'Deploy to Cloud Run'

images:
- 'us-central1-docker.pkg.dev/$PROJECT_ID/my-repo/my-app:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
